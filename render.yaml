# 비령 v0.5부터 커뮤니티 API가 필요하므로 Static Site 대신 독립 Web Service를 사용합니다.
# DATABASE_URL은 비령 전용 PostgreSQL URL을 Render Dashboard에서 비밀 환경변수로 설정하세요.
services:
  - type: web
    name: biryeong
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BIRYEONG_ADMIN_USERNAME
        sync: false
      - key: BIRYEONG_ADMIN_PASSWORD
        sync: false

# 비령 화면을 GitHub Pages 로 내보낸다.
# 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 고르면,
# main 브랜치에 올릴 때마다 아래 화면 파일만 모아 Pages 에 올린다(server/ · systems/ · tests/ 는 올리지 않는다).
# (Source 를 "Deploy from a branch" → main / (root) 로 골라도 index.html 이 맨 위에 있어 그대로 열린다.)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 화면 파일 모으기
        run: |
          mkdir -p _site
          cp index.html app.js auth.js config.js styles.css community.js community.css game-data.js titles.js titles2.js story.js story-data.js sync.js quest.js opening.js codex-data.js server.js .nojekyll _site/
          cp -r assets fonts play _site/
      # 관리자 코드: 저장소 Settings → Secrets and variables → Actions (또는 Environments → github-pages) 에 ADMIN_CODE 를 넣는다.
      # Secret 으로 넣어도, Variable 로 넣어도 읽는다. 코드 자체는 올리지 않고 SHA-256 만 config.js 에 적는다.
      # 비어 있으면 config.js 의 임시 코드 그대로 둔다(로그인 화면에서 틀리면 '임시 코드를 쓰는 중'이라고 알려 준다).
      - name: 관리자 코드 넣기
        env:
          ADMIN_CODE: ${{ secrets.ADMIN_CODE || vars.ADMIN_CODE }}
        run: |
          if [ -n "$ADMIN_CODE" ]; then
            CODE=$(printf '%s' "$ADMIN_CODE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            HASH=$(printf '%s' "$CODE" | sha256sum | cut -d' ' -f1)
            sed -i -E "s/adminCodeHash: '[0-9a-f]*'/adminCodeHash: '$HASH'/; s/adminCodeFrom: '[a-z]*'/adminCodeFrom: 'github'/" _site/config.js
            grep -q "adminCodeHash: '$HASH'" _site/config.js || { echo "::error::config.js 에 관리자 코드를 넣지 못했다"; exit 1; }
            echo "관리자 코드를 넣었다. (SHA-256 앞 8자리: ${HASH:0:8} · 코드 길이 ${#CODE}자)"
          else
            echo "::warning::ADMIN_CODE 가 비어 있다 — Secret/Variable 이름이 ADMIN_CODE 인지 확인. 지금은 임시 관리자 코드를 쓴다."
          fi
      # Supabase: 저장소 Settings → Secrets and variables → Actions → Variables 에 SUPABASE_URL · SUPABASE_KEY 를 넣는다.
      # 둘 다 브라우저에 공개되는 값이라 Variable 로 넣으면 된다(Secret 으로 넣어도 읽는다). 비어 있으면 서버 없이 돈다.
      - name: Supabase 연결 넣기
        env:
          SB_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SB_KEY: ${{ vars.SUPABASE_KEY || secrets.SUPABASE_KEY }}
        run: |
          SB_URL=$(printf '%s' "$SB_URL" | tr -d '[:space:]' | sed 's#/*$##')
          SB_KEY=$(printf '%s' "$SB_KEY" | tr -d '[:space:]')
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            case "$SB_KEY" in sb_secret_*) echo "::error::SUPABASE_KEY 에 secret 키를 넣었다 — Publishable key(sb_publishable_…)를 넣어야 한다"; exit 1;; esac
            sed -i -E "s#supabaseUrl: '[^']*'#supabaseUrl: '$SB_URL'#; s#supabaseAnonKey: '[^']*'#supabaseAnonKey: '$SB_KEY'#" _site/config.js
            grep -q "supabaseUrl: '$SB_URL'" _site/config.js || { echo "::error::config.js 에 Supabase 주소를 넣지 못했다"; exit 1; }
            echo "Supabase 를 연결했다: $SB_URL (키 앞부분 ${SB_KEY:0:15}…)"
          else
            echo "::warning::SUPABASE_URL · SUPABASE_KEY 중 비어 있는 값이 있다 — 서버 없이 이 브라우저의 값만 쓴다."
          fi
      # 브라우저가 옛 config.js · auth.js 를 붙들고 있지 않게, 올릴 때마다 주소 끝에 판 번호를 붙인다.
      - name: 설정 파일 새로 읽게 하기
        run: |
          sed -i -E "s/src=\"(config|auth)\.js\"/src=\"\1.js?v=${GITHUB_SHA::8}\"/g" _site/index.html
          grep -o 'src="[a-z]*\.js?v=[0-9a-f]*"' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
